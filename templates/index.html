<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>IX Endpoint Services - Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link href="/static/css/ix-theme.css" rel="stylesheet">
    <link href="/static/css/ix-dashboard.css" rel="stylesheet">
</head>

<body>

    <div class="ix-shell">

        <aside class="ix-sidebar">
            <div class="ix-wordmark">
                <img src="/static/img/ix-logo.png" alt="Intellectyx">
                <span class="ix-wordmark-sub">IX Endpoint Services</span>
            </div>

            <nav class="ix-sidebar-nav">
                <a href="/" class="ix-sidebar-link active">
                    <svg class="ix-sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></svg>
                    Dashboard
                </a>
                <a href="/#devices" class="ix-sidebar-link">
                    <svg class="ix-sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
                    Devices
                </a>
            </nav>

            <div class="ix-sidebar-footer">
                <a href="#" class="ix-sidebar-link" id="sidebarLogout">
                    <svg class="ix-sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    Logout
                </a>
            </div>
        </aside>

        <div class="ix-main">
            <header class="ix-topheader">
                <div>
                    <div class="ix-topheader-title">Dashboard</div>
                    <div class="ix-topheader-crumbs">Endpoint monitoring overview</div>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="ix-user-chip" id="userChip"></span>
                    <button class="btn ix-btn-outline btn-sm" id="logoutBtn">Logout</button>
                </div>
            </header>

            <div class="ix-content">

                <div class="row g-3 mb-4">
                    <div class="col-6 col-xl-3">
                        <div class="ix-stat-card">
                            <div class="ix-stat-label">Total Devices</div>
                            <div class="ix-stat-value" id="statTotalDevices">-</div>
                        </div>
                    </div>
                    <div class="col-6 col-xl-3">
                        <div class="ix-stat-card">
                            <div class="ix-stat-label">Online</div>
                            <div class="ix-stat-value ix-accent" style="color: var(--ix-online);" id="statOnline">-</div>
                        </div>
                    </div>
                    <div class="col-6 col-xl-3">
                        <div class="ix-stat-card">
                            <div class="ix-stat-label">Offline</div>
                            <div class="ix-stat-value" style="color: var(--ix-offline);" id="statOffline">-</div>
                        </div>
                    </div>
                    <div class="col-6 col-xl-3">
                        <div class="ix-stat-card">
                            <div class="ix-stat-label">Active Users</div>
                            <div class="ix-stat-value" id="statActiveUsers">-</div>
                        </div>
                    </div>
                </div>

                <div class="ix-card p-3" id="devices">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <h6 class="mb-0 fw-semibold">Live Devices</h6>
                        <span class="ix-kpi-note" id="refreshText">Loading...</span>
                    </div>
                    <div class="table-responsive">
                        <table class="ix-table mb-0">
                            <thead>
                                <tr>
                                    <th>Hostname</th>
                                    <th>User</th>
                                    <th>Status</th>
                                    <th>IP Address</th>
                                    <th>Last Seen</th>
                                </tr>
                            </thead>
                            <tbody id="devicesTableBody">
                                <tr><td colspan="5" class="text-center text-muted py-4">Loading devices...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="/static/js/format.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        IXAuth.requireAuth();

        const user = IXAuth.getUser();
        if (user) {
            document.getElementById("userChip").innerHTML =
                `${user.username}${user.role ? ` <span class="ix-role-pill">${user.role}</span>` : ""}`;
        }

        document.getElementById("logoutBtn").addEventListener("click", () => IXAuth.logout());
        document.getElementById("sidebarLogout").addEventListener("click", (e) => {
            e.preventDefault();
            IXAuth.logout();
        });

        function statusBadge(status) {
            const isOnline = status === "ONLINE";
            const cls = isOnline ? "ix-badge-online" : "ix-badge-offline";
            return `<span class="ix-badge ${cls}"><span class="ix-badge-dot"></span>${status}</span>`;
        }

        async function refreshDashboard() {
            try {
                const [summaryRes, devicesRes] = await Promise.all([
                    IXAuth.authFetch("/api/dashboard/summary"),
                    IXAuth.authFetch("/api/dashboard/live-devices"),
                ]);

                const summary = await summaryRes.json();
                const devices = await devicesRes.json();

                const onlineCount = devices.filter(d => d.status === "ONLINE").length;
                const offlineCount = devices.length - onlineCount;

                document.getElementById("statTotalDevices").textContent = summary.devices;
                document.getElementById("statOnline").textContent = onlineCount;
                document.getElementById("statOffline").textContent = offlineCount;
                document.getElementById("statActiveUsers").textContent = summary.active_sessions;

                const tbody = document.getElementById("devicesTableBody");

                if (!devices.length) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No devices registered yet.</td></tr>`;
                } else {
                    tbody.innerHTML = devices.map(d => `
                        <tr>
                            <td><a class="ix-hostname-link" href="/device/${d.device_id}">${d.hostname}</a></td>
                            <td>${d.username || "-"}</td>
                            <td>${statusBadge(d.status)}</td>
                            <td>${d.ip_address || "-"}</td>
                            <td>${IXFormat.dateTime(d.last_seen)}</td>
                        </tr>
                    `).join("");
                }

                document.getElementById("refreshText").textContent =
                    "Updated " + new Date().toLocaleTimeString();

            } catch (err) {
                document.getElementById("refreshText").textContent = "Unable to refresh.";
            }
        }

        refreshDashboard();
        setInterval(refreshDashboard, 10000);
    </script>

</body>

</html>
