<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign In - IX Endpoint Services</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link href="/static/css/ix-theme.css" rel="stylesheet">
</head>

<body>

    <div class="ix-login-shell">
        <div class="ix-login-card">

            <div class="ix-wordmark">
                <img src="/static/img/ix-logo.png" alt="Intellectyx">
                <span class="ix-wordmark-sub">IX Endpoint Services</span>
            </div>

            <div id="loginError" class="ix-login-error"></div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label class="ix-form-label form-label" for="username">Username</label>
                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        autocomplete="username"
                        required>
                </div>

                <div class="mb-4">
                    <label class="ix-form-label form-label" for="password">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" class="btn ix-btn-primary w-100" id="submitBtn">
                    Sign In
                </button>
            </form>

        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        // If already signed in, skip the login page entirely.
        if (IXAuth.isLoggedIn()) {
            window.location.href = "/";
        }

        const form = document.getElementById("loginForm");
        const errorBox = document.getElementById("loginError");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            errorBox.classList.remove("show");
            errorBox.textContent = "";
            submitBtn.disabled = true;
            submitBtn.textContent = "Signing in...";

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            try {
                await IXAuth.login(username, password);
                window.location.href = "/";
            } catch (err) {
                errorBox.textContent = "Invalid username or password.";
                errorBox.classList.add("show");
                submitBtn.disabled = false;
                submitBtn.textContent = "Sign In";
            }
        });
    </script>

</body>

</html>
